<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Automações — Tech com brilho</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08080E}
a{color:#C4B5FD}a:hover{color:#DDD6FE}
button,input{font-family:inherit}
input::placeholder{color:#8B8BA3}
.c-nav{transition:background .15s ease,color .15s ease}
.c-nav:hover{background:rgba(255,255,255,.05);color:#F4F4FA}
.c-card{transition:border-color .2s ease,box-shadow .25s ease,transform .2s ease}
.c-card:hover{border-color:rgba(167,139,250,.45);box-shadow:0 0 0 1px rgba(167,139,250,.15),0 18px 50px -12px rgba(124,58,237,.45);transform:translateY(-2px)}
.c-btn{transition:box-shadow .2s ease,transform .1s ease}
.c-btn:hover{box-shadow:0 0 28px rgba(168,85,247,.65)}
.c-btn:active{transform:translateY(1px)}
.c-sw{transition:background .25s ease,box-shadow .25s ease}
.c-knob{transition:margin-left .22s ease}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 820px; background: radial-gradient(900px 420px at 70% -120px, rgba(124,58,237,.28), rgba(8,8,14,0) 70%), #08080E; font-family: Inter, system-ui, sans-serif; color: #E9E9F2; font-size: 14px">
  <aside style="flex: 1 1 232px; max-width: 272px; box-sizing: border-box; border-right: 1px solid rgba(255,255,255,.06); padding: 22px 12px; display: flex; flex-direction: column; gap: 28px; background: rgba(12,12,20,.6)">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px">
      <div style="width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, {{accent}}, #C026D3); box-shadow: 0 0 22px rgba(168,85,247,.55); display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
      </div>
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.01em">ChatIntegrAI</span>
    </div>
    <nav aria-label="Menu principal" style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
        <a href="#" class="c-nav" style="display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: {{n.color}}; background: {{n.bg}}; font-weight: 500; box-shadow: {{n.shadow}}">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>
          <span>{{n.label}}</span>
        </a>
      </sc-for>
    </nav>
    <div style="border-top: 1px solid rgba(255,255,255,.06); padding: 14px 10px 0; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 30px; height: 30px; border-radius: 999px; background: rgba(167,139,250,.18); color: #DDD6FE; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px">LO</div>
        <div style="min-width: 0">
          <div style="font-weight: 500; font-size: 13px">Loja Outlet</div>
          <div style="color: #9C9CB4; font-size: 12px">2 contas conectadas</div>
        </div>
      </div>
      <a href="TechClaro.dc.html" class="c-nav" style="display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 2px; border-radius: 10px; text-decoration: none; color: #A9A9C0; font-size: 14px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path></svg>
        Tema claro
      </a>
      <button type="button" class="c-nav" style="display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 2px; border: 0; border-radius: 10px; background: transparent; color: #A9A9C0; font-size: 14px; cursor: pointer">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
        Sair
      </button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 44px 48px; display: flex; flex-direction: column; gap: 26px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="max-width: 560px">
        <div style="display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(167,139,250,.3); background: rgba(124,58,237,.12); color: #DDD6FE; font-size: 12px; margin-bottom: 12px">
          <span style="width: 6px; height: 6px; border-radius: 999px; background: #A78BFA; box-shadow: 0 0 10px #A78BFA"></span>{{liveCount}} automações rodando agora
        </div>
        <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 32px; font-weight: 600; letter-spacing: -0.03em; color: #F7F7FB">Automações</h1>
        <p style="margin: 8px 0 0; color: #A9A9C0; line-height: 1.55">{{desc}}</p>
      </div>
      <button type="button" class="c-btn" style="height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: linear-gradient(135deg, {{accent}}, #C026D3); color: #FFFFFF; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 0 18px rgba(168,85,247,.4)">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        Nova automação
      </button>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
      <div role="tablist" aria-label="Canais" style="display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07)">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button type="button" role="tab" aria-selected="{{t.aria}}" onClick="{{t.pick}}" style="height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: {{t.bg}}; color: {{t.color}}; font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: {{t.shadow}}">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg>
            {{t.label}}
            <span style="font-size: 12px; opacity: .8">{{t.count}}</span>
          </button>
        </sc-for>
      </div>
      <label style="display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 14px; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; background: rgba(255,255,255,.03); color: #9C9CB4">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar automações</span>
        <input type="search" placeholder="Buscar por nome ou palavra-chave" style="border: 0; outline: none; font-size: 14px; width: 230px; background: transparent; color: #E9E9F2">
      </label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
        <div class="c-card" style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; padding: 18px 20px; border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015)); border: 1px solid rgba(255,255,255,.08)">
          <div style="display: flex; align-items: center; gap: 14px; flex: 1 1 300px; min-width: 0">
            <div style="width: 42px; height: 42px; flex-shrink: 0; border-radius: 12px; background: rgba(124,58,237,.16); border: 1px solid rgba(167,139,250,.25); color: #C4B5FD; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.icon}}"></path></svg>
            </div>
            <div style="min-width: 0; display: flex; flex-direction: column; gap: 7px">
              <div style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 600; font-size: 16px; color: #F7F7FB">{{it.name}}</div>
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: #A9A9C0; font-size: 13px">
                <span style="padding: 2px 8px; border-radius: 6px; background: rgba(167,139,250,.14); color: #DDD6FE; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px">{{it.trigger}}</span>
                <span>{{it.scope}}</span>
              </div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 22px; flex: 0 0 auto">
            <svg aria-hidden="true" width="96" height="32" viewBox="0 0 96 32" fill="none"><path d="{{it.spark}}" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="{{it.sparkOpacity}}"></path></svg>
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 600; font-size: 17px; color: #F7F7FB">{{it.sent}}</span>
              <span style="color: #9C9CB4; font-size: 12px">enviadas</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 600; font-size: 17px; color: #F7F7FB">{{it.ctr}}</span>
              <span style="color: #9C9CB4; font-size: 12px">cliques</span>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; flex: 0 0 auto">
            <span style="display: flex; align-items: center; gap: 6px; min-width: 116px; font-size: 13px; color: {{it.statusColor}}">
              <span style="width: 7px; height: 7px; border-radius: 999px; background: {{it.dot}}; box-shadow: 0 0 10px {{it.dot}}"></span>{{it.status}}
            </span>
            <button type="button" aria-pressed="{{it.pressed}}" aria-label="Ativar ou pausar {{it.name}}" onClick="{{it.toggle}}" style="width: 48px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <span class="c-sw" style="width: 42px; height: 24px; border-radius: 999px; background: {{it.track}}; box-shadow: {{it.glow}}; display: flex; align-items: center; padding: 3px; box-sizing: border-box">
                <span class="c-knob" style="width: 18px; height: 18px; border-radius: 999px; background: #FFFFFF; margin-left: {{it.knob}}"></span>
              </span>
            </button>
            <button type="button" aria-label="Mais ações" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #9C9CB4; cursor: pointer; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg>
            </button>
          </div>
        </div>
      </sc-for>
    </div>
    <p style="margin: 0; color: #8B8BA3; font-size: 12px">Números de exemplo, só para a prévia.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7C3AED","options":["#7C3AED","#2563EB","#059669","#EA580C"]},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'comments', on: { c1: true, c2: true, c3: false, s1: true, s2: true, d1: true, d2: false } };
  }
  renderVals() {
    var self = this;
    var accent = this.props.accent ?? '#7C3AED';
    var tab = this.state.tab;
    var ICON = {
      comments: 'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z',
      stories: 'M12 21a9 9 0 1 1 9-9M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
      direct: 'M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z'
    };
    var SPARKS = [
      'M2 26 L14 22 L26 24 L38 14 L50 17 L62 9 L74 12 L86 5 L94 7',
      'M2 22 L14 24 L26 16 L38 18 L50 11 L62 14 L74 8 L86 10 L94 4',
      'M2 18 L14 20 L26 19 L38 21 L50 20 L62 22 L74 21 L86 22 L94 21'
    ];
    var DATA = {
      comments: [
        { id: 'c1', name: 'Link do catálogo', trigger: 'LINK', scope: 'em 3 publicações escolhidas', sent: '128', ctr: '34%' },
        { id: 'c2', name: 'WhatsApp da loja', trigger: 'Qualquer comentário', scope: 'em todas as publicações', sent: '412', ctr: '21%' },
        { id: 'c3', name: 'Lançamento da coleção', trigger: 'EUQUERO', scope: 'no próximo reel', sent: '—', ctr: '—', waiting: true }
      ],
      stories: [
        { id: 's1', name: 'Tabela de preços', trigger: 'PREÇO', scope: 'em respostas a qualquer story', sent: '57', ctr: '41%' },
        { id: 's2', name: 'Obrigado pela marcação', trigger: 'Marcação no story', scope: 'quando marcarem a loja', sent: '23', ctr: '12%' }
      ],
      direct: [
        { id: 'd1', name: 'Horário de funcionamento', trigger: 'HORÁRIO', scope: 'em mensagens diretas', sent: '89', ctr: '—' },
        { id: 'd2', name: 'Boas-vindas', trigger: 'Qualquer mensagem', scope: '1 vez a cada 24h por pessoa', sent: '310', ctr: '18%' }
      ]
    };
    var DESC = {
      comments: 'Responda quem comenta nos seus posts e reels: por DM e, se quiser, publicamente no comentário.',
      stories: 'Responda quem responde aos seus stories ou marca sua loja no próprio story.',
      direct: 'Responda mensagens diretas automaticamente, por palavra-chave ou para toda conversa nova.'
    };
    var live = 0;
    Object.keys(this.state.on).forEach(function (k) { if (self.state.on[k]) live += 1; });
    var tabs = [
      { id: 'comments', label: 'Comentários' },
      { id: 'stories', label: 'Stories' },
      { id: 'direct', label: 'Direct' }
    ].map(function (t) {
      var sel = t.id === tab;
      return {
        label: t.label, icon: ICON[t.id], count: DATA[t.id].length,
        aria: sel ? 'true' : 'false',
        bg: sel ? 'linear-gradient(135deg, ' + accent + ', #C026D3)' : 'transparent',
        color: sel ? '#FFFFFF' : '#A9A9C0',
        shadow: sel ? '0 0 18px rgba(168,85,247,.45)' : 'none',
        pick: function () { self.setState({ tab: t.id }); }
      };
    });
    var items = DATA[tab].map(function (it, i) {
      var on = !!self.state.on[it.id];
      var waiting = it.waiting && on;
      return {
        name: it.name, trigger: it.trigger, scope: it.scope, sent: it.sent, ctr: it.ctr,
        icon: ICON[tab],
        spark: SPARKS[i % SPARKS.length],
        sparkOpacity: on ? '1' : '0.3',
        status: waiting ? 'Aguardando reel' : (on ? 'Ativa' : 'Pausada'),
        statusColor: waiting ? '#FCD34D' : (on ? '#86EFAC' : '#9C9CB4'),
        dot: waiting ? '#F59E0B' : (on ? '#22C55E' : '#52525B'),
        track: on ? 'linear-gradient(135deg, ' + accent + ', #C026D3)' : 'rgba(255,255,255,.12)',
        glow: on ? '0 0 14px rgba(168,85,247,.5)' : 'none',
        knob: on ? '18px' : '0px',
        pressed: on ? 'true' : 'false',
        toggle: function () {
          var next = Object.assign({}, self.state.on);
          next[it.id] = !on;
          self.setState({ on: next });
        }
      };
    });
    var NAV = [
      ['Dashboard', 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z'],
      ['Automações', 'M13 2L3 14h9l-1 8 10-12h-9l1-8z'],
      ['Contas', 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0'],
      ['Logs de DMs', 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01'],
      ['Configurações', 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6'],
      ['API e MCP', 'M16 18l6-6-6-6M8 6l-6 6 6 6'],
      ['Diagnóstico', 'M22 12h-4l-3 9L9 3l-3 9H2']
    ];
    var nav = NAV.map(function (n) {
      var active = n[0] === 'Automações';
      return {
        label: n[0], d: n[1],
        color: active ? '#F7F7FB' : '#A9A9C0',
        bg: active ? 'rgba(124,58,237,.18)' : 'transparent',
        shadow: active ? 'inset 0 0 0 1px rgba(167,139,250,.28)' : 'none'
      };
    });
    return { accent: accent, tabs: tabs, items: items, nav: nav, desc: DESC[tab], liveCount: live };
  }
}
</script>
</body>
</html>
